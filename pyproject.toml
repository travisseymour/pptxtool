[project]
name = "pptxtool"
version = "2026.10.30.3"
description = "GUI for turning PowerPoint presentations into printable notes and watermarked, compressed PDFs."
readme = "README.md"
authors = [{name = "Travis L. Seymour, PhD", email = "nogard@ucsc.edu"}]
requires-python = ">=3.12,<3.15"
license = "GPL-3.0-or-later"
dependencies = [
    "PySide6-Essentials>=6.6,<7",
    "python-pptx>=1.0,<2",
    "pypdf>=4.0,<7",
    "reportlab>=4.0,<6",
    "lxml>=5.0,<7",
    "pillow>=10.1,<14",
    "pymupdf>=1.24.3,<3",
]

[project.urls]
"Bug Tracker" = "https://github.com/travisseymour/pptxtool/issues"
"Documentation" = "https://github.com/travisseymour/pptxtool#readme"

[project.gui-scripts]
pptxtool = "pptxtool.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pptxtool"]
exclude = []

[dependency-groups]
dev = [
    "ruff>=0.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true